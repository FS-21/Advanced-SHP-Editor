name: Build and Release

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main ]

jobs:
  build-web:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.x'

    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'

    - name: Run build script
      run: python build.py --no-desktop

    - name: Determine Version Name
      id: vars
      run: |
        if [ "${{ github.event_name }}" == "pull_request" ]; then
          echo "version=PR-${{ github.event.pull_request.number }}" >> $GITHUB_OUTPUT
        else
          echo "version=${{ github.ref_name }}" >> $GITHUB_OUTPUT
        fi

    - name: Prepare Standalone Asset
      run: |
        cd Build
        zip "../Advanced-SHP-Editor-${{ steps.vars.outputs.version }}.zip" advanced_shp_editor.html
        cd ..

    - name: Prepare PWA Asset
      run: |
        cd Build/PWA
        zip -r "../../Advanced-SHP-Editor-PWA-${{ steps.vars.outputs.version }}.zip" .
        cd ../..

    - name: Upload Web Artifacts
      uses: actions/upload-artifact@v4
      with:
        name: web-dist
        path: Advanced-SHP-Editor-*.zip

  build-desktop:
    needs: build-web
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: 'windows-latest'
          - platform: 'ubuntu-22.04'
    runs-on: ${{ matrix.platform }}

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.x'

    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'

    - name: Install Rust stable
      uses: dtolnay/rust-toolchain@stable

    - name: Install Linux dependencies
      if: matrix.platform == 'ubuntu-22.04'
      run: |
        sudo apt-get update
        sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf libgtk-3-dev

    - name: Run build script (prepare web bundle)
      run: python build.py --no-desktop

    - name: Install Tauri CLI
      run: cargo install tauri-cli --version "^2.0" --locked

    - name: Build Tauri Desktop App
      run: cargo tauri build

    - name: Prepare Desktop Assets
      shell: bash
      run: |
        mkdir -p desktop-dist
        if [ "${{ matrix.platform }}" == "windows-latest" ]; then
          if [ -f "src-tauri/target/release/Advanced-SHP-Editor.exe" ]; then
            cp "src-tauri/target/release/Advanced-SHP-Editor.exe" desktop-dist/
          elif [ -f "src-tauri/target/release/advanced-shp-editor.exe" ]; then
            cp "src-tauri/target/release/advanced-shp-editor.exe" desktop-dist/Advanced-SHP-Editor.exe
          fi
        else
          find src-tauri/target/release/bundle/appimage -name "*.AppImage" -exec cp {} desktop-dist/ \; 2>/dev/null || true
          find src-tauri/target/release/bundle/deb -name "*.deb" -exec cp {} desktop-dist/ \; 2>/dev/null || true
        fi

    - name: Upload Desktop Artifacts
      uses: actions/upload-artifact@v4
      with:
        name: desktop-${{ matrix.platform }}
        path: desktop-dist/*

  release:
    needs: [build-web, build-desktop]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
    - name: Download all artifacts
      uses: actions/download-artifact@v4
      with:
        merge-multiple: true
        path: release-assets

    - name: List Release Assets
      run: ls -la release-assets

    - name: Publish GitHub Release
      uses: softprops/action-gh-release@v2
      with:
        files: release-assets/*
        generate_release_notes: true
        draft: false
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
