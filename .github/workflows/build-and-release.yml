name: Build and Release

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.x'

    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'

    - name: Run build script
      run: python build.py

    - name: Determine Version Name
      id: vars
      run: |
        if [ "${{ github.event_name }}" == "pull_request" ]; then
          echo "version=PR-${{ github.event.pull_request.number }}" >> $GITHUB_OUTPUT
        else
          echo "version=${{ github.ref_name }}" >> $GITHUB_OUTPUT
        fi

    - name: Prepare Standalone Asset
      run: |
        cd Build
        zip "../Advanced-SHP-Editor-${{ steps.vars.outputs.version }}.zip" advanced_shp_editor.html
        cd ..

    - name: Prepare PWA Asset
      run: |
        cd Build/PWA
        zip -r "../../Advanced-SHP-Editor-PWA-${{ steps.vars.outputs.version }}.zip" .
        cd ../..

    - name: Upload Artifacts (Push/PR)
      uses: actions/upload-artifact@v4
      with:
        name: distribution-files
        path: |
          Advanced-SHP-Editor-*.zip

    - name: Create Release and Upload Web Assets
      if: startsWith(github.ref, 'refs/tags/v')
      uses: softprops/action-gh-release@v2
      with:
        files: |
          Advanced-SHP-Editor-*.zip
        generate_release_notes: true
        draft: true
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  build-tauri:
    needs: build
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: 'windows-latest'
          - platform: 'ubuntu-22.04'
    runs-on: ${{ matrix.platform }}
    permissions:
      contents: write

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.x'

    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'

    - name: Install Rust stable
      uses: dtolnay/rust-toolchain@stable

    - name: Install Linux dependencies
      if: matrix.platform == 'ubuntu-22.04'
      run: |
        sudo apt-get update
        sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf libgtk-3-dev

    - name: Run build script (prepare web bundle)
      run: python build.py

    - name: Install Tauri CLI
      run: cargo install tauri-cli --version "^2.0" --locked

    - name: Build Tauri Desktop App
      run: cargo tauri build

    - name: Upload Desktop Artifacts
      uses: actions/upload-artifact@v4
      with:
        name: desktop-bundle-${{ matrix.platform }}
        path: |
          src-tauri/target/release/Advanced-SHP-Editor.exe
          src-tauri/target/release/advanced-shp-editor.exe
          src-tauri/target/release/advanced-shp-editor
          src-tauri/target/release/bundle/nsis/*.exe
          src-tauri/target/release/bundle/appimage/*.AppImage
          src-tauri/target/release/bundle/deb/*.deb

    - name: Upload Desktop Assets to Release
      if: startsWith(github.ref, 'refs/tags/v')
      uses: softprops/action-gh-release@v2
      with:
        files: |
          src-tauri/target/release/Advanced-SHP-Editor.exe
          src-tauri/target/release/advanced-shp-editor.exe
          src-tauri/target/release/advanced-shp-editor
          src-tauri/target/release/bundle/nsis/*.exe
          src-tauri/target/release/bundle/appimage/*.AppImage
          src-tauri/target/release/bundle/deb/*.deb
        draft: true
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
